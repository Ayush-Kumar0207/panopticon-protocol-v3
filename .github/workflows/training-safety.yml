name: Training safety

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: training-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cpu-validation:
    name: Required safety checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-training.txt
          python -m pip check
      - name: Validate spec, Python, and notebooks
        run: |
          python -m json.tool training_specs/security_first_v5.json > /dev/null
          python -m json.tool training_specs/historical_attempts.json > /dev/null
          python -m compileall -q . -x '/(\.git|\.venv|static|ui/node_modules)/'
          python -c "import json, pathlib; [json.loads(p.read_text(encoding='utf-8-sig')) for p in pathlib.Path('.').glob('*.ipynb')]"
      - name: Run full CPU test suite
        run: python -m pytest -q
      - name: Run smoke and security regression gates
        run: |
          python smoke_test.py
          python security_regression_test.py
      - name: Scan text artifacts for credential signatures
        run: |
          python -c "from pathlib import Path; from tools.training_preflight import scan_secrets; findings=scan_secrets(Path('.').resolve()); assert not findings, findings"
